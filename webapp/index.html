<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<link rel="icon" href="/logo.png">
<title>Crypto Buddies</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f6f8; --surface:#fff; --ink:#0f172a; --ink2:#334155; --muted:#64748b; --faint:#94a3b8;
  --line:#e8eaee; --soft:#f1f3f6; --accent:#5b4bdb; --accent-soft:#eeebff; --green:#16a34a; --green-soft:#e8f7ee;
  --amber:#d97706; --r:18px; --shadow:0 1px 2px rgba(15,23,42,.04),0 4px 16px rgba(15,23,42,.05);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,sans-serif;font-size:15px;-webkit-font-smoothing:antialiased}
body{padding-bottom:calc(76px + env(safe-area-inset-bottom))}
button{font-family:inherit;cursor:pointer;border:0}
.wrap{max-width:520px;margin:0 auto;padding:0 16px}
.num{font-variant-numeric:tabular-nums}

/* Kopfzeile */
header{position:sticky;top:0;z-index:10;background:rgba(245,246,248,.88);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
header .wrap{display:flex;align-items:center;justify-content:space-between;height:56px}
.brand{font-weight:800;font-size:17px;letter-spacing:-.2px;display:flex;align-items:center;gap:8px}
.brand svg{flex:none;border-radius:9px}
.brand i{width:26px;height:26px;border-radius:8px;background:var(--accent);display:grid;place-items:center;color:#fff;font-style:normal;font-size:14px}
.chips{display:flex;gap:6px}
.chip{display:flex;align-items:center;gap:5px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 11px;font-weight:700;font-size:13px}
.demo-tag{font-size:10px;font-weight:700;color:var(--accent);background:var(--accent-soft);padding:2px 7px;border-radius:6px;margin-left:4px}

/* Runde */
.round{background:var(--ink);color:#fff;border-radius:22px;padding:18px;margin:4px 0 18px;position:relative;overflow:hidden}
.round::after{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(124,108,255,.45),transparent 65%)}
.round .lbl{font-size:12px;color:#a5adbd;font-weight:600}
.round .big{font-size:30px;font-weight:800;letter-spacing:-.5px;margin:2px 0 14px}
.round .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;position:relative;z-index:1}
.round .row3 b{display:block;font-size:15px;font-weight:700;margin-top:2px}
.hint{display:flex;gap:8px;align-items:center;background:rgba(255,255,255,.08);border-radius:12px;padding:9px 11px;margin-top:14px;font-size:12.5px;color:#d7dbe4;position:relative;z-index:1}
.hint.ok{color:#9ae6b4}

h2{font-size:18px;font-weight:800;letter-spacing:-.2px;margin:22px 0 4px}
.sub{color:var(--muted);font-size:13px;margin:0 0 12px}
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;margin-bottom:12px}

/* Buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;padding:13px 14px;border-radius:14px;font-weight:700;font-size:14.5px;background:var(--accent);color:#fff;transition:transform .08s,opacity .2s}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.38;cursor:default;transform:none}
.btn.ghost{background:var(--soft);color:var(--ink)}
.btn.green{background:var(--green)}
.btn small{font-weight:600;opacity:.8}

/* Sammlung */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.fig{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);overflow:hidden;text-align:left;padding:0;color:inherit}
.fig .art{aspect-ratio:1;display:grid;place-items:center;position:relative}
.fig .art svg{width:86%;height:86%}
.fig .lv{position:absolute;top:7px;left:7px;background:rgba(255,255,255,.92);font-size:10.5px;font-weight:700;border-radius:7px;padding:2px 6px;color:var(--ink)}
.fig .dot{position:absolute;top:9px;right:9px;width:8px;height:8px;border-radius:50%}
.fig .meta{padding:8px 9px 10px}
.fig .nm{font-weight:700;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fig .pr{font-size:11.5px;color:var(--green);font-weight:600;margin-top:1px}
.fig.locked .art svg{filter:brightness(0);opacity:.12}
.fig.locked .art{background:var(--soft)!important}
.fig.locked .nm{color:var(--faint)}
.seg{display:flex;background:var(--soft);border-radius:12px;padding:3px;margin-bottom:12px}
.seg button{flex:1;background:none;padding:8px;border-radius:9px;font-weight:600;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.empty{text-align:center;padding:28px 16px}
.empty p{color:var(--muted);margin:6px 0 16px}

/* Packs */
.pack{display:flex;gap:14px;align-items:center}
.pack .box{width:76px;height:96px;border-radius:14px;flex:none;display:grid;place-items:center;position:relative;overflow:hidden;color:#fff;font-weight:800;font-size:11px;letter-spacing:.08em}
.pack .box::before{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.45) 45%,transparent 60%);animation:shine 3.2s infinite}
@keyframes shine{0%{transform:translateX(-100%)}60%,100%{transform:translateX(100%)}}
.box.start{background:linear-gradient(150deg,#7c6cff,#5b4bdb)}
.box.bronze{background:linear-gradient(150deg,#e4a676,#a8622f)}
.box.silber{background:linear-gradient(150deg,#e5e9f0,#98a2b3);color:#334155}
.box.gold{background:linear-gradient(150deg,#fde68a,#d4a017);color:#5b3b00}
.pack .info{flex:1;min-width:0}
.pack .t{font-weight:700;font-size:16px}
.pack .d{color:var(--muted);font-size:12.5px;margin:2px 0 10px}
.jp{padding:6px 14px;border:1.5px solid #f2c94c;background:linear-gradient(180deg,#fffaf0,#fff)}
.jprow{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid #f6ead0}
.jprow:first-child{border-top:0}
.jpart{width:48px;height:48px;border-radius:12px;display:grid;place-items:center;flex:none}
.jpart svg{width:90%;height:90%}
.jprow b{display:block;font-weight:700;font-size:14px}
.jprow span{color:var(--muted);font-size:12px}
.jpusd{font-weight:800;font-size:18px;color:#b7791f;text-align:right}
.jpusd small{font-size:11px;font-weight:600;color:var(--muted)}
.shopgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.shopitem{background:var(--surface);box-shadow:var(--shadow);border-radius:16px;padding:16px 12px;text-align:center;color:var(--ink)}
.shopitem b{display:block;font-size:17px;font-weight:800}
.shopitem span{display:block;margin-top:4px;color:var(--accent);font-weight:700;font-size:13.5px}
.shopitem:disabled{opacity:.4}
.chiprow{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.chiprow .btn{padding:11px 4px;font-size:13px}
.switch{position:relative;width:46px;height:28px;border-radius:28px;background:var(--line);flex:none;transition:.2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:.2s}
.switch.on{background:var(--green)}.switch.on::after{left:21px}
.tour .tname,.card .tname{font-weight:700;font-size:16px}
.tleft{flex:none;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:12px;padding:5px 9px;border-radius:9px;white-space:nowrap}
.prizes{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 4px}
.prizes span{background:var(--soft);border-radius:9px;padding:5px 9px;font-size:12.5px;font-weight:600}
.me{margin:10px 0 2px;padding:10px 12px;border-radius:12px;background:#fffbeb;font-size:13.5px;color:var(--ink2)}
.nbody{white-space:pre-wrap;color:var(--ink2);line-height:1.5}
.bonus{padding:14px 16px}
.bonus b{font-weight:700}
.bonus span{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.bonus.done{background:linear-gradient(180deg,#fffaf0,#fff);border:1.5px solid #f2c94c}
.seg button{white-space:nowrap}
.fig.isjp{outline:2px solid #f2c94c}
.fig[data-open]{cursor:pointer}
.xpbar{height:5px;border-radius:4px;background:var(--soft);margin:6px 0 4px;overflow:hidden}
.xpbar i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,#22d3ee,#7c3aed)}
.xpt{font-size:10.5px;color:var(--muted);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xpt.ok{color:var(--green)}
.xbtn{display:block;width:100%;margin-top:6px;padding:7px 4px;border-radius:10px;font-size:11.5px;font-weight:700;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.xbtn.lvl{background:var(--ink);color:#fff}
.xbtn:disabled{opacity:.5}
.wake{background:linear-gradient(140deg,#1e2a6b,#3b2a8f 60%,#5b21b6);color:#fff;border-radius:22px;padding:18px;margin:0 0 18px}
.wake.sleep{background:linear-gradient(140deg,#1f2937,#374151)}
.wake .top{display:flex;align-items:center;gap:12px}
.wake .sun{font-size:34px;line-height:1}
.wake .tt{flex:1}.wake .tt b{display:block;font-size:16.5px}.wake .tt small{color:#c7cbe0;font-size:12px}
.wake .left{text-align:right}.wake .left b{display:block;font-size:24px;font-weight:800;color:#fcd34d}.wake .left small{font-size:11px;color:#c7cbe0}
.wake .segs{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;margin:14px 0 6px}
.wake .segs i{height:8px;border-radius:5px;background:rgba(255,255,255,.18)}
.wake .segs i.on{background:linear-gradient(90deg,#fbbf24,#f97316)}
.wake .row{display:flex;justify-content:space-between;font-size:12px;color:#d7dbe4}
.wake .wbtn{margin-top:12px;background:linear-gradient(90deg,#fbbf24,#f97316);color:#1e1b4b;font-size:15px}
.wake p{font-size:11.5px;color:#c7cbe0;margin:10px 0 0;line-height:1.45}
.pass{background:linear-gradient(140deg,#0f172a,#312e81 55%,#7c3aed);color:#fff;border-radius:20px;padding:18px;margin:0 0 14px;position:relative;overflow:hidden}
.pass::after{content:"♾️";position:absolute;right:-6px;top:-14px;font-size:92px;opacity:.12}
.pass .pt{font-size:12px;font-weight:700;color:#fcd34d;letter-spacing:.6px}
.pass h3{margin:4px 0 10px;font-size:20px}
.pass ul{margin:0 0 12px;padding:0;list-style:none;font-size:13.5px;line-height:1.7;color:#e0e7ff}
.pass .btn{background:linear-gradient(90deg,#fbbf24,#f97316);color:#1e1b4b}
.pass small{display:block;text-align:center;color:#c7d2fe;font-size:11.5px;margin-top:8px}
.xptab .kv span:last-child{color:var(--ink);font-weight:600}
.tag.jptag{background:linear-gradient(90deg,#f6c445,#d69e2e);margin-left:4px}
.odds{display:flex;height:6px;border-radius:6px;overflow:hidden;margin:2px 0 6px;background:var(--soft)}
.legend{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:11px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--c);margin-right:4px;vertical-align:0}

/* Belohnungen */
.reward{display:flex;align-items:center;gap:14px}
.reward .ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;flex:none;font-size:22px;background:var(--accent-soft)}
.reward .tx{flex:1}
.reward .tx b{display:block;font-weight:700}
.reward .tx span{color:var(--muted);font-size:12.5px}
.reward .btn{width:auto;padding:10px 14px;font-size:13.5px}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:14px}
.days div{background:var(--soft);border-radius:10px;padding:7px 0;text-align:center;font-size:11px;font-weight:600;color:var(--muted)}
.days div b{display:block;font-size:12px;color:var(--ink2)}
.days .done{background:var(--accent);color:#e0dcff}.days .done b{color:#fff}
.days .next{outline:1.5px dashed var(--accent)}

/* Wallet */
.bal{font-size:34px;font-weight:800;letter-spacing:-.6px}
.bar{height:8px;border-radius:8px;background:var(--soft);overflow:hidden;margin:12px 0 6px}
.bar i{display:block;height:100%;background:var(--green);border-radius:8px;transition:width .4s}
.kv{display:flex;justify-content:space-between;padding:11px 0;border-top:1px solid var(--line);font-size:14px}
.kv:first-child{border-top:0}
.kv span{color:var(--muted)}
.kv b{font-weight:600}
.steps{margin:0;padding-left:18px;color:var(--ink2);font-size:13.5px;line-height:1.7}
.lb{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.lb:first-child{border-top:0}
.lb .rk{width:22px;color:var(--muted);font-weight:700}
.lb .n{flex:1;font-weight:600}

/* Navigation */
nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav .wrap{display:flex;padding:0 8px}
nav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 8px;color:var(--faint);text-decoration:none;font-size:11px;font-weight:600;position:relative}
nav a svg{width:23px;height:23px}
nav a.act{color:var(--accent)}
nav a .badge{position:absolute;top:6px;left:calc(50% + 8px);width:8px;height:8px;border-radius:50%;background:#ef4444;border:2px solid #fff}

/* Bottom Sheet */
.scrim{position:fixed;inset:0;background:rgba(15,23,42,.38);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--surface);border-radius:24px 24px 0 0;max-width:560px;margin:0 auto;transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);padding:10px 18px calc(20px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}
.sheet.on{transform:none}
.earn-btn{display:flex;align-items:center;gap:12px;width:100%;margin:0 0 14px;padding:12px 14px;border:0;border-radius:16px;cursor:pointer;text-align:left;color:#fff;font:inherit;background:linear-gradient(120deg,#0e7490,#6d28d9)}
.earn-btn .ei{font-size:22px}.earn-btn .et{flex:1;display:flex;flex-direction:column}.earn-btn small{opacity:.85;font-size:12px}.earn-btn .ea{font-size:24px;opacity:.8}
.lvseg{display:flex;gap:6px;margin:12px 0}.lvseg button{flex:1;border:0;border-radius:12px;padding:9px 0;font:inherit;font-weight:700;background:#eef0f4;color:var(--muted);cursor:pointer}
.lvseg button.on{background:#1e1b4b;color:#fff}
.esum{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:6px}.esum div{border-radius:14px;padding:10px 12px;background:linear-gradient(135deg,#ede9fe,#e0f2fe)}
.esum div.mine{grid-column:span 2;background:linear-gradient(135deg,#dcfce7,#e0f2fe)}
.esum small{display:block;color:var(--muted);font-size:11.5px}.esum b{font-size:17px}.esum span{font-size:11.5px;color:var(--muted)}
.eed{display:flex;align-items:center;gap:8px;margin:16px 0 8px;font-weight:800;font-size:15px}.eed i{width:10px;height:10px;border-radius:50%}
.eed span{margin-left:auto;font-size:12px;color:var(--muted);font-weight:600}
.egrid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.ec{background:#f5f6f8;border-radius:12px;padding:6px 4px 7px;text-align:center;position:relative;border-top:3px solid var(--c)}
.ec svg{width:100%;height:auto;aspect-ratio:1;display:block}.ec .n{font-size:10.5px;font-weight:700;line-height:1.15;min-height:2.3em;display:flex;align-items:center;justify-content:center}
.ec .v{font-size:12.5px;font-weight:800;color:#047857;white-space:nowrap}.ec .m{font-size:9.5px;color:var(--muted);white-space:nowrap;letter-spacing:-.2px}
.ec .own{position:absolute;top:4px;right:4px;background:#1e1b4b;color:#fff;font-size:9.5px;font-weight:700;border-radius:8px;padding:1px 5px}
.ec.jp{border-top-color:#f2c94c;background:#fffbeb}
.promo-btn{display:flex;align-items:center;gap:12px;width:100%;margin-top:12px;padding:12px 14px;border:0;border-radius:16px;cursor:pointer;text-align:left;color:#fff;font:inherit;background:linear-gradient(120deg,#6d28d9,#db2777)}
.promo-btn .pi{font-size:22px}.promo-btn .pt{flex:1;display:flex;flex-direction:column}.promo-btn small{opacity:.85;font-size:12px}.promo-btn .pa{font-size:24px;opacity:.8}
.promo-h{font-size:21px;font-weight:800;letter-spacing:-.3px;margin:4px 0 2px}
.promo-sec{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin:18px 0 8px}
.bgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bcard{background:var(--bg,#f5f6f8);border-radius:16px;padding:8px;display:flex;flex-direction:column;gap:6px}
.bcard img{width:100%;border-radius:10px;display:block;object-fit:cover}
.bcard.story{grid-row:span 2}.bcard.story img{aspect-ratio:9/16}.bcard.square img{aspect-ratio:1}.bcard.landscape img{aspect-ratio:1200/628}
.bcard .bl{font-size:12.5px;font-weight:700;display:flex;justify-content:space-between;color:var(--muted)}
.bcard .btn{padding:8px 10px;font-size:13px;min-height:0}
.wprow{display:flex;align-items:center;gap:12px;padding:12px;border-radius:16px;background:var(--bg,#f5f6f8);margin-bottom:8px}
.wprow .wpi{width:44px;height:56px;border-radius:8px;background:linear-gradient(150deg,#3b0764,#831843);display:flex;align-items:center;justify-content:center;font-size:20px;flex:none}
.wprow .wpt{flex:1}.wprow .wpt small{display:block;color:var(--muted);font-size:12px}
.wprow .btn{padding:8px 12px;font-size:13px;min-height:0;width:auto}
.x{position:absolute;top:14px;right:14px;width:32px;height:32px;border-radius:50%;background:var(--soft);color:var(--muted);font-size:14px;z-index:2}
.grab{width:38px;height:5px;border-radius:5px;background:var(--line);margin:0 auto 12px}
.detail-art{border-radius:20px;aspect-ratio:1.7;display:grid;place-items:center;margin-bottom:14px}
.detail-art svg{height:88%}
.tag{display:inline-block;font-size:11px;font-weight:700;color:#fff;padding:3px 8px;border-radius:7px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}
.stat{background:var(--soft);border-radius:14px;padding:11px 12px}
.stat span{display:block;font-size:12px;color:var(--muted);font-weight:500}
.stat b{font-size:17px;font-weight:700}
.stat b em{font-style:normal;color:var(--green);font-size:13px;font-weight:600}
.btn-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.btn-row .btn{flex-direction:column;gap:1px;padding:10px 6px;font-size:14px}

/* Pack öffnen */
.reveal{position:fixed;inset:0;z-index:60;background:radial-gradient(circle at 50% 40%,#2a2350,#0b0a17 70%);display:none;flex-direction:column;align-items:center;justify-content:center;padding:24px;color:#fff}
.reveal.on{display:flex}
.rv-pack{width:150px;height:190px;border-radius:22px;animation:shake .7s ease-in-out 2}
@keyframes shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-6deg) scale(1.04)}75%{transform:rotate(6deg) scale(1.04)}}
.rv-card{width:240px;border-radius:24px;overflow:hidden;background:#fff;color:var(--ink);transform:scale(.6);opacity:0;transition:transform .45s cubic-bezier(.2,1.4,.4,1),opacity .3s}
.rv-card.on{transform:none;opacity:1}
.rv-card .art{aspect-ratio:1;display:grid;place-items:center}
.rv-card .art svg{width:82%}
.rv-card .m{padding:12px 14px 16px;text-align:center}
.rv-card .m b{font-size:18px;font-weight:800;display:block;margin:6px 0 2px}
.rv-glow{position:absolute;width:340px;height:340px;border-radius:50%;filter:blur(40px);opacity:.55;z-index:-1}
.rv-note{margin-top:18px;color:#c9c6e8;font-size:14px;text-align:center;min-height:20px}
.reveal .btn{max-width:240px;margin-top:14px}

/* Demo-Werbung */

async function server(action, body={}){
  const r = await fetch("/api/"+action,{method:"POST",headers:{"Content-Type":"application/json","X-Init-Data":tg.initData},body:JSON.stringify(body)});
  const j = await r.json().catch(()=>({detail:T("server_err")}));
  if(!r.ok) throw new Error(typeof j.detail==="string" ? j.detail : T("server_err"));
  return j;
}

const call = (a,b)=> server(a,b);

// 1. AdsGram (Reward-Block)  2. RichAds (Video)  3. Monetag – der nächste springt ein, wenn der vorige nichts zeigen kann
const waitFor = (fn, ms=4000)=> new Promise(res=>{ const t0=Date.now(); (function poll(){ const v=fn(); if(v || Date.now()-t0>ms) return res(v); setTimeout(poll,150); })(); });
const okAg = (id, intPrefix)=> !!id && (intPrefix ? /^int-\d+$/ : /^\d+$/).test(String(id).trim());
async function showRewardedAd(){
  const ag = S && okAg(S.adsgram_block_id) ? String(S.adsgram_block_id).trim() : "", mt = S && S.monetag_zone, ra = S && S.richads;
  if(!ag && !mt && !ra){ toast(T("no_ad")); return false; }   // kein Werbeanbieter eingetragen
  if(ag){
    const A = await waitFor(()=>window.Adsgram);
    if(A){
      try{ await A.init({blockId: String(ag)}).show(); return true; }
      catch(r){ if(r && r.error === false){ toast(T("ad_cancel")); return false; } }   // selbst abgebrochen → kein Ersatz
    }
  }
  if(ra){
    const R = await waitFor(()=>window.__richads, 3000);
    if(R){ try{ await R.triggerInterstitialVideo(); return true; }catch(e){} }
  }
  if(mt){
    const show = await waitFor(()=>window["show_"+mt]);
    if(show){ try{ await show(); return true; }catch(e){} }
  }
  toast(T("no_ad")); return false;
}

/* ================================================================ Live-Werte */
function tick(){
  if(!S) return;
  if(now() >= S.round_end){ call("state").then(apply).catch(()=>{}); S.round_end += PERIOD; }
  const left = hms(S.round_end-now());
  if($("cd")) $("cd").textContent = left;
  if($("cd2")) $("cd2").textContent = left;
  if($("rp")) $("rp").textContent = money(liveRound());
  if($("wakeLeft") && !S.pass_active){ const l = S.awake_until-now(); $("wakeLeft").textContent = hm(l); if(l<=0 && !$("wakeCard").classList.contains("sleep")) render(); }
  let reready = false;
  document.querySelectorAll("[data-xpid]").forEach(el=>{ const k = S.kumpels.find(x=>x.id===el.dataset.xpid); if(!k) return;
    const rest = k.xp_need - xpNow(k); if(rest<=0) reready = true; else el.textContent = T("xp_left",{t:ms(rest)}); });
  if(reready) render();
  document.querySelectorAll("[data-end]").forEach(el=>{ const sec=+el.dataset.end-now(); if(sec<=0){ el.textContent=T("ended"); return; }
    const d=Math.floor(sec/86400), h=Math.floor(sec%86400/3600), m=Math.floor(sec%3600/60);
    el.textContent = T("ends_in",{t: d?`${d} ${T("d_short")} ${h} ${T("h_short")}`: h?`${h} ${T("h_short")} ${m} ${T("m_short")}`:`${m} ${T("m_short")}`}); });
  const b = $("adBtn");
  if(b){ const w = S.next_ad_at-now(); if(w>0){ b.disabled=true; b.innerHTML=`<span class="num">${Math.ceil(w)} s</span>`; } else if(b.disabled){ b.disabled=false; b.textContent=T("watch"); } }
  const cw = S.next_ad_at-now();
  document.querySelectorAll(".adb").forEach(x=>{
    if(cw>0){ if(!x.dataset.orig){ x.dataset.orig = x.innerHTML; x.dataset.wasOff = x.disabled ? "1" : ""; } x.disabled = true; x.innerHTML = `⏳ <span class="num">${Math.ceil(cw)} s</span>`; }
    else if(x.dataset.orig){ x.innerHTML = x.dataset.orig; x.disabled = !!x.dataset.wasOff; delete x.dataset.orig; }
  });
}

  const el = e.target.closest("button,[data-open],[data-go]"); if(!el || el.disabled) return;
  const d = el.dataset;
  if(d.open) return openDetail(d.open);
  if(d.go){ location.hash = d.go; return; }
  if(d.f){ filter = d.f; return render(); }
  if(d.pack) return openPack(d.pack);
  if("close" in d) return closeSheet();
  if("closerv" in d){ $("reveal").classList.remove("on"); maybeInterstitial(); return; }
  if(d.lv){ const r = await act("levelup",{char:openId, steps:+d.lv}); if(r) toast(T("lv_toast",{n:r.levels, s:r.levels>1?(LANG==="de"?"n":"s"):"", c:fmt(r.spent)})); return; }
  if(d.lvq){ const r = await act("levelup",{char:d.lvq, steps:1}); if(r) toast(T("lv_toast",{n:r.levels, s:"", c:fmt(r.spent)})); return; }
  if("wake" in d){ el.disabled=true; if(await showRewardedAd()){ const r = await act("ad",{purpose:"wake"}); if(r) toast("☀️ "+T("woke",{h:fmtH(S.wake_hours)})); } else render(); return; }
  if(d.skip){ el.disabled=true; if(await showRewardedAd()){ const r = await act("ad",{purpose:"skip", char:d.skip});
      if(r){ const k = S.kumpels.find(x=>x.id===d.skip); toast((r.filled ? T("filled") : T("skip_prog",{a:k?k.skip_ads:1, b:k?k.skip_videos:2})) + (r.diamonds?` · +${r.diamonds} 💎`:"")); } } else render(); return; }
  if("ad" in d){ el.disabled=true; if(await showRewardedAd()){ const r = await act("ad"); if(r) toast(`+${r.diamonds} 💎`); } else render(); return; }
  if("daily" in d){ const r = await act("daily"); if(r) toast(T("daily_toast",{n:r.diamonds})); return; }
  if("share" in d){
    const url = "https://t.me/share/url?url="+encodeURIComponent(S.ref_link)+"&text="+encodeURIComponent(T("share_text",{n:S.ref_diamonds}));
    tg ? tg.openTelegramLink(url) : window.open(url); return;
  }
  if("earn" in d) return openEarnings();
  if(d.elv){ const sc=$("sheet").scrollTop; openEarnings(+d.elv); $("sheet").scrollTop=sc; return; }
  if("promo" in d) return openPromo();
  if(d.dl) return promoDownload(d.dl);
  if(d.story) return promoStory(d.story);
  if(d.openpdf){ const u = promoUrl(d.openpdf); tg && tg.openLink ? tg.openLink(u) : window.open(u); return; }
  if("copy" in d){
    const inp = $("refInput");
    try{ await navigator.clipboard.writeText(S.ref_link); }catch(_){ inp.select(); try{ document.execCommand("copy"); }catch(__){} }
    toast(T("copied")); return;
  }
  if(d.buydia){ const r = await act("buy_diamonds",{diamonds:+d.buydia}); if(r) toast(T("bought",{n:fmt(r.diamonds)})); return; }
  if(d.topup){
    try{ const {url} = await server("topup",{amount:+d.topup}); tg.openTelegramLink(url); toast(T("after_pay")); setTimeout(()=>call("state").then(apply),1000); }
    catch(err){ toast(err.message); } return;
  }
  if("buypass" in d){
    try{ const {url} = await server("buy_pass"); tg.openTelegramLink(url); toast(T("pass_after")); setTimeout(()=>call("state").then(apply),1000); }
    catch(err){ toast(err.message); } return;
  }
  if("topcheck" in d){ await act("topup_check"); toast(T("updated")); return; }
  if("auto" in d){ await act("autopayout",{on:!S.autopayout}); return; }
  if(d.buy){
    try{ const {link} = await server("buy",{package:d.buy}); tg.openInvoice(link, st=>{ if(st==="paid"){ toast(T("thanks")); setTimeout(()=>call("state").then(apply),1500); } }); }
    catch(err){ toast(err.message); }
  }
});
$("scrim").addEventListener("click", closeSheet);

function route(){ const h=location.hash.slice(1); tab = VIEWS[h] ? h : "sammlung"; closeSheet(); render(); window.scrollTo(0,0); }
window.addEventListener("hashchange", route);

/* ================================================================ Start */
if(tg){ try{ tg.ready(); tg.expand(); tg.setHeaderColor && tg.setHeaderColor("#f5f6f8"); tg.setBackgroundColor && tg.setBackgroundColor("#f5f6f8"); }catch(e){} }
applyStatic();
if(!LIVE){   // außerhalb von Telegram geöffnet
  $("view").innerHTML = `<div class="card empty" style="margin-top:24px"><div style="font-size:44px">📱</div><h2 style="margin:6px 0 0">${T("only_tg")}</h2><p>${T("only_tg_txt")}</p></div>`;
  throw new Error("not in Telegram");
}
call("state").then(st=>{
  if(LIVE && st.lang && st.lang !== LANG){ LANG = st.lang; try{ localStorage.setItem("kk_lang", LANG); }catch(_){} }   // Server-Einstellung gilt
  apply(st); route();
}).catch(e=>{ $("view").innerHTML = `<div class="card" style="margin-top:16px">${T("conn_fail")}: ${esc(e.message)}</div>`; });
setInterval(tick, 1000);
setInterval(()=>{ call("state").then(apply).catch(()=>{}); }, 60000);
</script>
